# Smart Parking - C++ core configuration (read by parkinglot.exe).
# Format: key = value. Lines starting with # are comments.
# Every value below is also the built-in default, so the core behaves the
# same way if this file is missing.

lot_name = PARK-DBMS Main Lot

# Fee policy: "peak" = the parkinglot.c rule (base rate, peak rate in the
# peak window); "flat" = the original CSV app's single rate per minute.
fee_strategy = peak
flat_rate_per_minute = 1.00

# Rate cards per vehicle type: <base Rs/min> <peak Rs/min>.
# CAR comes from parkinglot.c; BIKE from the pricing_rules seed data.
# Billing unit (unchanged from parkinglot.c): 1 real second = 1 billed minute.
rate.CAR  = 0.67 0.80
rate.BIKE = 0.40 0.50

# Peak window: every Saturday/Sunday, plus [start, end) hours on every day.
peak_start_hour = 18
peak_end_hour   = 22
weekend_is_peak = true

# Slot layout (mirrors database/seed.sql): <first>-<last> <zone> <floor> <type>
slots = 1-12  A 1 STANDARD
slots = 13-18 B 1 STANDARD
slots = 19-21 B 1 COMPACT
slots = 22-24 C 2 COMPACT
slots = 25-27 C 2 LARGE
slots = 28-30 D 2 LARGE

# Storage used by the C++ CLI: "csv" (default) or "mysql" (needs a build with
# -DPARKING_WITH_MYSQL=ON). Relative paths are relative to the working directory.
storage_backend = csv
data_file = parking_data.csv
